name: Prototype checks
on:
  push:
    branches: [main, "feat/wakeel-interactive-pwa-prototype"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test