function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>openOrder(b.dataset.order));document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{let l=leads.find(x=>x.id===b.dataset.match);l.status='converted';orders.unshift({id:'WK-'+(24019+orders.length),buyer:l.buyer,product:l.product,arProduct:l.arProduct,market:l.market,value:l.value,status:'matching'});render();toast(t('matched'))});document.getElementById('search')?.addEventListener('input',e=>{query=e.target.value;render();let s=document.getElementById('search');s.focus();s.setSelectionRange(query.length,query.length)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.getElementById('add')?.addEventListener('click',()=>{leads.unshift({id:'RFQ-9013',buyer:'Cairo Imports Ltd.',product:'Organic cotton',arProduct:'قطن عضوي',market:'Italy',arMarket:'إيطاليا',value:62500,confidence:91,status:'new'});render();toast(t('sample'))});document.getElementById('calculate')?.addEventListener('click',()=>{let v=Number(document.getElementById('calcval').value);document.getElementById('result').textContent=v>=0&&Number.isFinite(v)?t('marketer')+': '+money(v*.005)+' · '+t('platform')+': '+money(v*.001)+' · '+t('total')+': '+money(v*.006):t('empty')})}
function openOrder(id){let o=orders.find(x=>x.id===id),next={matching:'quoted',quoted:'confirmed',confirmed:'shipped',shipped:'complete'}[o.status],action={matching:'quote',quoted:'confirm',confirmed:'ship',shipped:'complete'}[o.status];document.getElementById('modal').innerHTML='<div class="modalbg" id="back"><section class="modal"><div class="modalhead"><div><small>'+t('details')+'</small><h2>'+o.id+'</h2></div><button class="lang" id="close">×</button></div><div class="modalgrid"><div><small>'+t('buyer')+'</small>'+o.buyer+'</div><div><small>'+t('product')+'</small>'+(lang==='ar'?o.arProduct:o.product)+'</div><div><small>'+t('amount')+'</small>'+money(o.value)+'</div><div><small>'+t('status')+'</small>'+t(o.status)+'</div></div><div class="modalactions"><button class="lang" id="cancel">'+t('close')+'</button>'+(next?'<button class="primary" id="advance">'+t(action)+'</button>':'')+'</div></section></div>';let close=()=>document.getElementById('modal').innerHTML='';document.getElementById('close').onclick=close;document.getElementById('cancel').onclick=close;document.getElementById('back').onclick=e=>{if(e.target.id==='back')close()};document.getElementById('advance')?.addEventListener('click',()=>{o.status=next;close();render();toast(t('status'))})}
document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('wk-lang',lang);render();document.getElementById('lang').textContent=t('language')};document.getElementById('lang').textContent=t('language');let installEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});document.getElementById('install').onclick=async()=>{if(installEvent){installEvent.prompt();installEvent=null}else toast('Install from browser menu / أضف إلى الشاشة الرئيسية')};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
